service:
  name: iot-device-management
  environment: development
  shutdown_timeout: 10s

http:
  listen: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  cors:
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    allowed_headers: ["Accept", "Authorization", "Content-Type", "X-Device-ID", "X-Device-Credential", "X-Request-ID"]

grpc:
  listen: ":9090"
  max_recv_msg_size: 4194304
  max_send_msg_size: 4194304
  connection_timeout: 10s

websocket:
  path: /api/v1/telemetry/ws
  read_limit: 1048576
  write_wait: 10s
  pong_wait: 60s
  max_message_queue: 1024
  allowed_origin: "*"

mqtt:
  enabled: false
  broker: tcp://localhost:1883
  client_id: iot-device-management
  username: ""
  password: ""
  subscribe_topics: ["devices/+/telemetry", "devices/+/events", "devices/+/attributes"]
  qos: 1
  connect_timeout: 5s
  reconnect_delay: 3s

storage:
  driver: memory
  postgres_dsn: postgres://iot:iot@localhost:5432/iot?sslmode=disable
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m
  migration_dir: migrations

telemetry:
  ingest_queue_size: 4096
  worker_count: 4
  max_batch_size: 512
  max_clock_skew: 5m
  default_retention: 24h
  downsample_buckets: ["1m", "5m", "1h"]

auth:
  default_token_ttl: 24h
  max_credential_length: 4096
  default_rate_limit: 120
  default_rate_window: 1m
  jwt_secret: development-only-secret

metrics:
  enabled: true
  path: /metrics

logging:
  level: info
  format: json
